<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Results</title>
    <link rel="stylesheet" href="vew.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="container">
        <div id="top">
            <button id="backBtn"><i class="fas fa-arrow-left"></i></button>
            <button id="shareBtn"><i class="fas fa-share-alt"></i></button>
        </div>
        <div id="displayContainer">
            <div class="lineOne">
                <div id="houseSixten" class="house"><span class="house-number">8</span></div>
                <div id="houseFiften" class="house"><span class="house-number">7</span></div>                       
                <div id="houseFourten" class="house"><span class="house-number">6</span></div>
                <div id="houseThirten" class="house"><span class="house-number">5</span></div>            
                <div id="houseTwelve" class="house"><span class="house-number">4</span></div>
                <div id="houseEleven" class="house"><span class="house-number">3</span></div>
                <div id="houseTen" class="house"><span class="house-number">2</span></div>
                <div id="houseNine" class="house"><span class="house-number">1</span></div>
            </div>

            <div class="lineTwo">
                <div id="houseEight" class="house"><span class="house-number">12</span></div>
                <div id="houseSeven" class="house"><span class="house-number">11</span></div>
                <div id="houseSix" class="house"><span class="house-number">10</span></div>
                <div id="houseFive" class="house"><span class="house-number">9</span></div>
            </div>

            <div class="lineThree">
                <div id="houseFour" class="house"><span class="house-number">14</span></div>
                <div id="houseThree" class="house"><span class="house-number">13</span></div>
            </div>

            <div class="lineFour">
                <div id="houseSeventen" class="house"><span class="house-number"></span></div>
                <div id="houseTwo" class="house"><span class="house-number">15</span></div>
                <div id="houseOne" class="house"><span class="house-number">16</span></div>
            </div>
        </div>
       
        <div class="detailsContainer" id="detailsContainer">
            <div class="details" id="detailsContent">
                <button>Wish or First Move</button>
                <button>Success Or Undertaking</button>
                <button>Gain or Lose</button>
                <button>Foreign Land</button>
                <button>Stranger or Favor</button>
                <button>Property or Theft</button>
                <button>Friend or Dealings</button>
                <button>Short Travel</button>
                <button>Love and Regard</button>
                <button>Marriage</button>
                <button>Wife or Husband</button>
                <button>Son or Daugther</button>
                <button>Illness</button>
                <button>Prisoner</button>
                <button>Lucky or Unlucky</button>
                <button>Dreams</button>
            </div>
        </div>
    </div>

    <script src="vew.js"></script>
</body>
</html>
